name: Update laggy-world

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build new site before touching anything
        run: nix build --no-link github:lordofthelags/website
      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@main
        with:
          inputs: laggy-world
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          commit-msg: "laggy-world: bump to latest upstream site"
          pr-title: "Auto-update: laggy world website"
          pr-body: |
            Automated bump of the laggy world site. Build-tested, merges itself
            when checks pass, deployed by theros' nightly auto-upgrade.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
      - name: Enable auto-merge
        if: steps.update.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "${{ steps.update.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
